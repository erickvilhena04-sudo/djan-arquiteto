<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Rabiscos de transição</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; background: transparent; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Rabiscos animados para transições: pincelada de tinta que cobre a tela (corte escondido no pico),
// círculo de giz e seta de giz. Cada quadro é desenhado de forma determinística por (tipo, t, semente).
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function rng(seed) {                       // mulberry32
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeSoft = x => 0.65 * x + 0.35 * (x * x * (3 - 2 * x));   // quase linear, com partida e chegada suaves
const easeOut = x => 1 - Math.pow(1 - x, 3);

// ---------- pincelada em zigue-zague de tela cheia ----------
function buildZigzag(seed, spanX) {
  const r = rng(seed), pts = [];
  let x = -spanX, up = r() < 0.5;
  while (x < W + spanX) {
    const y = up ? -(260 + r() * 160) : H + 260 + r() * 160;
    pts.push([x + (r() - 0.5) * 26, y]);
    x += 34 + r() * 46;
    up = !up;
  }
  return pts;
}
function cumLen(pts) {
  const L = [0];
  for (let i = 1; i < pts.length; i++) {
    L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  }
  return L;
}
function pointAt(pts, L, d) {
  d = clamp(d, 0, L[L.length - 1]);
  let i = 1; while (i < L.length - 1 && L[i] < d) i++;
  const f = (d - L[i - 1]) / Math.max(1e-6, L[i] - L[i - 1]);
  return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f, i];
}
function strokeRange(pts, L, s, e, dx, dy) {
  const total = L[L.length - 1], ds = s * total, de = e * total;
  if (de - ds < 1) return;
  const p0 = pointAt(pts, L, ds), p1 = pointAt(pts, L, de);
  ctx.beginPath();
  ctx.moveTo(p0[0] + dx, p0[1] + dy);
  for (let i = p0[2]; i < p1[2]; i++) ctx.lineTo(pts[i][0] + dx, pts[i][1] + dy);
  ctx.lineTo(p1[0] + dx, p1[1] + dy);
  ctx.stroke();
}
// rabisco de giz: hachura rapida (tracos em zigue-zague curvos), como um lapis riscando
function chalkLoops(cx, cy, size, seed, alpha, lw) {
  const r = rng(seed);
  const ang = (r() - 0.5) * 1.2 + (r() < 0.5 ? 0.9 : -0.9);
  const dx = Math.cos(ang), dy = Math.sin(ang), px = -dy, py = dx;
  const n = 6 + Math.floor(r() * 4), gap = size * 0.28;
  ctx.save();
  ctx.strokeStyle = `rgba(244,240,228,${alpha})`;
  ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = `rgba(255,255,255,${alpha * 0.45})`; ctx.shadowBlur = 5;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const off = (i - n / 2) * gap, side = i % 2 ? 1 : -1;
    const x0 = cx + px * off - dx * size * side + (r() - 0.5) * 8;
    const y0 = cy + py * off - dy * size * side + (r() - 0.5) * 8;
    const x1 = cx + px * (off + gap * 0.5) + dx * size * side + (r() - 0.5) * 8;
    const y1 = cy + py * (off + gap * 0.5) + dy * size * side + (r() - 0.5) * 8;
    if (i === 0) ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo((x0 + x1) / 2 + px * size * 0.12 * (r() - 0.5), (y0 + y1) / 2 + py * size * 0.12 * (r() - 0.5), x1, y1);
  }
  ctx.stroke();
  ctx.restore();
}

function drawInk(t, seed, angleDeg, dir) {
  // t em [0,1]: 0-0.5 a tinta cobre a tela (corte escondido em 0.5), 0.5-1 a tinta sai varrendo.
  // Varias pinceladas em zigue-zague com atrasos diferentes: a frente fica irregular, como feita a mao.
  const K = 7;
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(angleDeg * Math.PI / 180);
  if (dir < 0) ctx.scale(-1, 1);
  ctx.translate(-W / 2, -H / 2);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const fronts = [];
  for (let k = 0; k < K; k++) {
    const r = rng(seed * 977 + k * 131);
    const d1 = r() * 0.34, d2 = r() * 0.34, wid = 110 + r() * 110;
    const pts = buildZigzag(seed * 53 + k * 101, 330), L = cumLen(pts);
    let head, tail;
    if (t <= 0.5) { head = easeSoft(clamp((t / 0.5 - d1) / (1 - d1))); tail = 0; }
    else { head = 1; tail = easeSoft(clamp(((t - 0.5) / 0.5 - d2) / (1 - d2))); }
    ctx.strokeStyle = k % 3 === 0 ? '#03060a' : '#06090e';
    ctx.lineWidth = wid;
    strokeRange(pts, L, tail, head, 0, 0);
    // cerdas: fios finos que passam um pouco do contorno
    const rb = rng(seed * 17 + k);
    for (let b = 0; b < 5; b++) {
      ctx.strokeStyle = rb() < 0.65 ? '#020407' : 'rgba(40,54,70,0.5)';
      ctx.lineWidth = 4 + rb() * 14;
      strokeRange(pts, L, clamp(tail + (rb() - 0.5) * 0.03), clamp(head + (rb() - 0.2) * 0.05), (rb() - 0.5) * wid * 1.5, 0);
    }
    if (t < 0.96 && head > 0.01 && head < 0.995) fronts.push([pts, L, head, 0.95]);
    if (t > 0.54 && tail > 0.01 && tail < 0.99) fronts.push([pts, L, tail, 0.8]);
  }
  // rabiscos de giz seguindo as bordas que avancam
  const tick = Math.floor(t * 20);
  let n = 0;
  for (const [pts, L, pos, a] of fronts) {
    if (n++ > 9) break;
    const p = pointAt(pts, L, pos * L[L.length - 1]);
    const rr = rng(seed * 31 + n + tick * 7);
    chalkLoops(p[0] + (rr() - 0.5) * 90, p[1] * 0.6 + rr() * H * 0.4 + (rr() - 0.5) * 300, 34 + rr() * 56, seed * 7 + n * 13 + tick, a, 3 + rr() * 2.5);
  }
  ctx.restore();
}

// ---------- círculo de giz desenhado à mão ----------
function drawRing(t, cx, cy, rx, ry, seed) {
  const r = rng(seed);
  const p = easeOut(clamp(t / 0.5));
  const fade = t > 0.7 ? 1 - (t - 0.7) / 0.3 : 1;
  const sweep = p * Math.PI * 2 * 1.18, a0 = -Math.PI * 0.7;
  for (let pass = 0; pass < 3; pass++) {
    ctx.save();
    ctx.strokeStyle = `rgba(246,242,230,${(0.95 - pass * 0.22) * fade})`;
    ctx.lineWidth = 9 - pass * 2.2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = `rgba(255,255,255,${0.55 * fade})`; ctx.shadowBlur = 10;
    ctx.beginPath();
    const steps = 90, jx = 7 + pass * 4;
    for (let i = 0; i <= steps; i++) {
      const a = a0 + sweep * (i / steps);
      const grow = 1 + 0.07 * (i / steps);   // a espiral abre um pouco, como um traço feito rápido
      const x = cx + Math.cos(a) * rx * grow + (r() - 0.5) * jx;
      const y = cy + Math.sin(a) * ry * grow + (r() - 0.5) * jx;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }
}

// ---------- seta de giz desenhada à mão ----------
function drawArrow(t, x0, y0, x1, y1, bend, seed) {
  const r = rng(seed);
  const p = easeOut(clamp(t / 0.7));
  const fade = t > 0.8 ? 1 - (t - 0.8) / 0.2 : 1;
  const cx = (x0 + x1) / 2 + bend * (y1 - y0) / 2, cy = (y0 + y1) / 2 - bend * Math.abs(x1 - x0) / 2;
  const pt = u => {
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return [a * x0 + b * cx + c * x1, a * y0 + b * cy + c * y1];
  };
  for (let pass = 0; pass < 3; pass++) {
    ctx.save();
    ctx.strokeStyle = `rgba(246,242,230,${(0.95 - pass * 0.25) * fade})`;
    ctx.lineWidth = 10 - pass * 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = `rgba(255,255,255,${0.5 * fade})`; ctx.shadowBlur = 9;
    ctx.beginPath();
    const steps = 50;
    for (let i = 0; i <= steps * p; i++) {
      const [x, y] = pt(i / steps);
      const jx = (r() - 0.5) * (5 + pass * 3), jy = (r() - 0.5) * (5 + pass * 3);
      if (i === 0) ctx.moveTo(x + jx, y + jy); else ctx.lineTo(x + jx, y + jy);
    }
    ctx.stroke();
    if (p > 0.92) {                                  // ponta da seta
      const [ex, ey] = pt(1), [bx, by] = pt(0.93);
      const ang = Math.atan2(ey - by, ex - bx), len = 78;
      ctx.beginPath();
      ctx.moveTo(ex + Math.cos(ang + 2.55) * len + (r() - 0.5) * 8, ey + Math.sin(ang + 2.55) * len + (r() - 0.5) * 8);
      ctx.lineTo(ex, ey);
      ctx.lineTo(ex + Math.cos(ang - 2.55) * len + (r() - 0.5) * 8, ey + Math.sin(ang - 2.55) * len + (r() - 0.5) * 8);
      ctx.stroke();
    }
    ctx.restore();
  }
}

window.renderFrame = function (kind, t, o) {
  ctx.clearRect(0, 0, W, H);
  if (kind === 'ink') drawInk(t, o.seed, o.angle, o.dir);
  else if (kind === 'ring') drawRing(t, o.cx, o.cy, o.rx, o.ry, o.seed);
  else if (kind === 'arrow') drawArrow(t, o.x0, o.y0, o.x1, o.y1, o.bend, o.seed);
  return true;
};
</script>
</body>
</html>
